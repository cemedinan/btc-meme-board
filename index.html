<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B0B2B" />
<title>BTC Meme Board · @ForecastQuant</title>
<style>
:root{--bg:#0B0B2B;--fg:#F2F2F5;--fg2:#9C9CC0;--acc:#C5E523;--line:#25255A;--hover:#15153F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.55 ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;-webkit-text-size-adjust:100%}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;background:none;border:0;padding:0;cursor:pointer;color:var(--acc)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px}
.title{font-size:22px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .u{color:var(--fg)}
.tools{display:flex;align-items:center;gap:16px;flex-shrink:0}
.ico{width:18px;height:18px;stroke:var(--fg2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.tools button{display:inline-flex;align-items:center;gap:5px;color:var(--fg2)}
.tag{color:var(--acc)}
main{max-width:860px;margin:0 auto;padding:14px 18px 60px}
.sys{color:var(--fg2);margin:6px 0}
.sys.strong{color:var(--fg)}
.nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 8px}
.nav button,.nav a{color:var(--acc)}
.nav button.on{color:var(--fg);text-decoration:underline;text-underline-offset:4px}
.post{border-top:1px solid var(--line);padding:14px 0}
.meta{color:var(--fg2);font-size:13px}
.who{color:var(--fg)}.who .h{color:var(--acc)}
.text{white-space:pre-wrap;word-wrap:break-word;margin:8px 0;color:var(--fg)}
.reply{margin:8px 0;padding-left:12px;border-left:2px solid var(--fg2)}
.reply .lbl,.skip .lbl{color:var(--acc);font-size:13px}
.reply pre{margin:4px 0;white-space:pre-wrap;font:inherit;color:var(--fg)}
.skip{color:var(--fg2);margin:8px 0}
.acts{display:flex;gap:18px;font-size:13px}
.acts button,.acts a{color:var(--acc)}
.acts button.copied{color:var(--fg)}
.img{display:block;width:100%;height:auto;border:1px solid var(--line);margin:10px 0}
.laugh{color:var(--acc)}
.day{color:var(--fg);margin:22px 0 4px}
@media(max-width:560px){body{font-size:14px}.title{font-size:18px}.bar{padding:12px}main{padding:10px 12px 48px}.tools{gap:12px}.hide-sm{display:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="title">btc-memes/<span class="u">@ForecastQuant</span></div>
  <div class="tools">
    <button type="button" id="xvs-refresh-btn" title="Refresh"><svg class="ico" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span class="hide-sm">refresh</span></button>
    <span class="tag">#memes</span>
  </div>
</header>
<main>
  <p class="sys strong">* BTC Meme Board · 2 original Bitcoin jokes + 3 original memes, made daily for @ForecastQuant *</p>
  <p class="sys" id="meta">* loading… *</p>
  <nav class="nav"><button type="button" data-f="today">#today_top5</button><button type="button" data-f="all">#last_7_days</button></nav>
  <section id="memes"></section>
  <p class="sys" style="margin-top:24px">* read-only: nothing is posted to X · all jokes, captions and cards are original · meme formats are public templates *</p>
</main>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmt(n){n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)}
async function copyDraft(btn,text){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const p=btn.textContent;btn.textContent='[copied]';btn.classList.add('copied');setTimeout(()=>{btn.textContent=p;btn.classList.remove('copied')},1400)}
const tz={timeZone:'America/Santiago'};let D,F='today';
function card(p,i){const tag=[p.type,p.format,p.timeliness].filter(Boolean).map(esc).join(' · ');
return`<article class="post"><div class="meta">#${i+1} · <span class="laugh">${tag}</span></div>${p.hook?`<div class="meta">hook: ${esc(p.hook)}</div>`:''}<img class="img" loading="lazy" src="./${esc(p.image)}" alt="${esc(p.image_alt||'meme')}"><div class="reply"><div class="lbl">suggested post/en</div><pre id="s-${p.id}">${esc(p.suggested_post)}</pre></div>${p.suggested_alt?`<div class="reply"><div class="lbl">alt version/en</div><pre id="a-${p.id}">${esc(p.suggested_alt)}</pre></div>`:''}<div class="acts"><button type="button" class="cp" data-id="s-${p.id}">[COPY POST]</button>${p.suggested_alt?`<button type="button" class="cp" data-id="a-${p.id}">[COPY ALT]</button>`:''}<a href="./${esc(p.image)}" download>[image ↓]</a></div></article>`}
function render(){const L=D.meta.latest_day;const t=D.entries.filter(e=>e.added===L),o=D.entries.filter(e=>e.added!==L);let h='';
if(F==='today'){h=t.map(card).join('')||'<p class="sys">* nothing today yet *</p>'}else{const days=[...new Set(D.entries.map(e=>e.added))];h=days.map(dy=>`<p class="day">## ${esc(dy)}</p>`+D.entries.filter(e=>e.added===dy).map(card).join('')).join('')}
document.getElementById('memes').innerHTML=h;document.querySelectorAll('.cp').forEach(b=>b.addEventListener('click',()=>copyDraft(b,document.getElementById(b.dataset.id).textContent)));document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===F))}
(async()=>{const r=await fetch('./data/memes.json?ts='+Date.now());D=await r.json();const up=new Date(D.meta.generated_at).toLocaleString('en-US',tz);
document.getElementById('meta').textContent=`* last update: ${up} (Chile) · ${D.entries.length} items from the last 7 days *`;
document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{F=b.dataset.f;render()}));render()})();
document.getElementById('xvs-refresh-btn').addEventListener('click',function(){const u=new URL(location.href);u.searchParams.set('r',Date.now());location.replace(u.toString())});
</script>
</body></html>
